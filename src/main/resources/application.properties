spring.application.name=dag-engine
server.port = 8091

# 1. Database Connection Settings
spring.datasource.url=jdbc:postgresql://localhost:5432/dag_nexus_db
spring.datasource.username=dag_engine_user
spring.datasource.password=nexus_secure_pass
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Static Resource Cache Control (prevents browser caching stale app.js / styles.css)
spring.web.resources.cache.cachecontrol.max-age=0
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
spring.web.resources.chain.cache=false

# Swagger / OpenAPI Settings
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# -------------------------------------------------------------
# DAG Engine AI Configuration
# -------------------------------------------------------------
# Active Provider: "gemini", "openai", or "custom"
dag.ai.provider=gemini

# Google Gemini Settings
dag.ai.gemini.api-key=${GCP_API_KEY}
dag.ai.gemini.model=gemini-3.5-flash
dag.ai.gemini.base-url=https://generativelanguage.googleapis.com

# Future Custom / Local Model (e.g., your own fine-tuned model or Ollama)
dag.ai.custom.base-url=http://localhost:8000/v1
dag.ai.custom.model=my-custom-dag-model